<!-- Load EmailJS library -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
  // Initialize EmailJS
  (function() {
    emailjs.init("67jp-54KduZJyCrLT"); // ✅ your public key
  })();

  // Calendar + form logic
  const calendar = document.getElementById("calendar");
  const formSection = document.getElementById("formSection");
  const selectedDateText = document.getElementById("selectedDateText");
  const confirmBtn = document.getElementById("confirmBtn");
  const confirmation = document.getElementById("confirmation");

  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth();
  const monthEnd = new Date(year, month + 1, 0);
  const daysInMonth = monthEnd.getDate();

  let selectedDate = null;

  // Create calendar days
  for (let i = 1; i <= daysInMonth; i++) {
    const day = document.createElement("div");
    day.classList.add("day");
    day.textContent = i;
    day.addEventListener("click", () => {
      document.querySelectorAll(".day").forEach(d => d.classList.remove("selected"));
      day.classList.add("selected");
      selectedDate = `${year}-${String(month + 1).padStart(2, "0")}-${String(i).padStart(2, "0")}`;
      selectedDateText.textContent = selectedDate;
      formSection.style.display = "block";
      confirmation.textContent = "";
    });
    calendar.appendChild(day);
  }

  confirmBtn.addEventListener("click", () => {
    const time = document.getElementById("timeInput").value;
    const name = document.getElementById("nameInput").value.trim();
    const phone = document.getElementById("phoneInput").value.trim();
    const email = document.getElementById("emailInput").value.trim();

    if (!selectedDate || !time || !name || !phone || !email) {
      alert("Please fill out all fields before confirming.");
      return;
    }

    const templateParams = {
      from_name: name,
      from_phone: phone,
      from_email: email,
      date: selectedDate,
      time: time
    };

    emailjs.send("service_xkx90fb", "template_j2t3kkh", templateParams)
      .then(() => {
        confirmation.innerHTML = `
          ✅ <strong>Appointment Confirmed!</strong><br>
          📅 Date: ${selectedDate}<br>
          ⏰ Time: ${time}<br>
          👤 Name: ${name}<br>
          📞 Phone: ${phone}<br>
          📧 Email: ${email}<br><br>
          ✉️ <i>Email sent to annasbooking123@gmail.com</i>
        `;
        formSection.style.display = "none";
      }, (error) => {
        console.error("EmailJS Error:", error);
        alert("Something went wrong sending the email. Please try again later.");
      });
  });
</script>
</body>
</html>
